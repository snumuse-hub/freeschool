p": "IT·제작", "tags": ["IT", "코딩", "분석"], "careers": ["IT공학"]}, {"name": "지식의 항해단", "activities": "독서, 글쓰기", "group": "독서·언어", "tags": ["독서", "글쓰기", "인문사회"], "careers": ["인문사회", "교육"]}, {"name": "컴퓨터부", "activities": "컴퓨터, 코딩", "group": "IT·제작", "tags": ["IT", "코딩"], "careers": ["IT공학"]}, {"name": "키네틱스", "activities": "배드민턴", "group": "스포츠", "tags": ["스포츠", "배드민턴", "운동"], "careers": ["체육"]}, {"name": "농구", "activities": "농구", "group": "스포츠", "tags": ["스포츠", "농구", "운동", "협업"], "careers": ["체육"]}, {"name": "탄소제로", "activities": "환경, 캠페인", "group": "환경·캠페인", "tags": ["환경", "캠페인", "협업", "기획"], "careers": ["봉사환경"]}, {"name": "페르소나", "activities": "연극, 무대설치, 의상, 조명", "group": "공연·무대", "tags": ["예술", "공연", "연극", "제작", "협업"], "careers": ["예술미디어"]}, {"name": "픽사티브", "activities": "밴드, 음악, 연주, 합주, 악기", "group": "음악·공연", "tags": ["예술", "음악", "공연", "협업"], "careers": ["예술미디어"]}, {"name": "에어로", "activities": "과학, 항공, 에어로켓, 우주", "group": "과학·제작", "tags": ["과학", "항공", "제작", "탐구"], "careers": ["IT공학", "수학과학"]}, {"name": "스포츠과학반", "activities": "종합체육", "group": "종합체육", "tags": ["스포츠", "운동", "협업"], "careers": ["체육"]}, {"name": "피지컬퍼포먼스", "activities": "종합체육", "group": "종합체육", "tags": ["스포츠", "운동", "협업"], "careers": ["체육"]}], "questions": [{"question": "새로운 문제를 만나면 더 끌리는 쪽은?", "a": "실험하며 과학 원리 확인하기", "at": ["과학", "실험", "탐구"], "b": "사회와 역사 자료를 읽고 해석하기", "bt": ["인문사회", "역사", "조사", "독서"]}, {"question": "무언가를 만든다면 어느 쪽이 좋나요?", "a": "게임·프로그램을 코딩해 보기", "at": ["IT", "코딩", "게임", "제작"], "b": "영상이나 방송 콘텐츠 만들기", "bt": ["미디어", "영상", "제작"]}, {"question": "무대와 공연에서는 무엇이 더 끌리나요?", "a": "연주·연기 등 공연에 참여하기", "at": ["공연", "예술", "음악", "연극"], "b": "무대 장치·의상·조명을 준비하기", "bt": ["공연", "제작", "연극", "협업"]}, {"question": "몸을 움직이며 활동한다면?", "a": "운동을 직접 하고 실력 키우기", "at": ["스포츠", "운동", "농구", "수영", "배드민턴"], "b": "운동이나 움직임을 원리부터 탐구하기", "bt": ["스포츠", "탐구", "분석", "수학"]}, {"question": "친구들과 시간을 보낸다면?", "a": "책을 읽고 생각을 글로 표현하기", "at": ["독서", "글쓰기", "인문사회"], "b": "사람의 생각과 행동을 이해하기", "bt": ["심리", "인문사회", "탐구"]}, {"question": "직접 기획해 보고 싶은 활동은?", "a": "환경 문제를 알리는 캠페인", "at": ["환경", "캠페인", "기획"], "b": "다른 사람을 돕는 봉사활동", "bt": ["봉사", "협업"]}], "interests": [["수학·논리", "수학"], ["과학·실험", "과학"], ["코딩·AI", "IT"], ["게임 만들기", "게임"], ["역사·사회", "인문사회"], ["경제·창업", "경제"], ["독서·글쓰기", "독서"], ["심리·교육", "심리"], ["미술·디자인", "미술"], ["음악·공연", "공연"], ["영상·방송", "미디어"], ["스포츠·운동", "스포츠"], ["봉사·환경", "환경"], ["항공·우주", "항공"], ["생명·의학", "생명"]], "careers": [["아직 잘 모르겠어요", "none"], ["공학·컴퓨터·AI", "IT공학"], ["의학·보건", "보건의학"], ["수학·자연과학", "수학과학"], ["인문·사회·법", "인문사회"], ["경제·경영", "경제경영"], ["예술·미디어", "예술미디어"], ["체육·스포츠", "체육"], ["교육·심리", "교육"], ["환경·공익", "봉사환경"]]};
const sportGroup=new Set(['오늘도득근','움직임연구소','스포츠과학반','피지컬퍼포먼스']);
const state={step:0,interest:[],balance:Array(6).fill(null),career:null,result:null,showAll:false};
const $=id=>document.getElementById(id);const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(state.result){renderResult();return;}let n=state.step, isInterest=n===0,isCareer=n===7;let title=isInterest?'어떤 분야에 가장 관심이 있나요?':isCareer?'현재 관심 있는 진로는?':DATA.questions[n-1].question;let hint=isInterest?'최대 2개를 선택하세요. 아직 진로를 몰라도 괜찮아요!':isCareer?'하나를 골라 주세요. 정하지 못했다면 ‘아직 잘 모르겠어요’를 선택해도 됩니다.':'더 끌리는 활동을 하나 골라 주세요. 정답은 없어요.';
let opts=isInterest?DATA.interests.map(x=>({label:x[0],value:x[1]})):isCareer?DATA.careers.map(x=>({label:x[0],value:x[1]})):[{label:DATA.questions[n-1].a,value:'a'},{label:DATA.questions[n-1].b,value:'b'}];let selected=isInterest?state.interest:isCareer?[state.career]:[state.balance[n-1]];
$('app').innerHTML=`<div class="meta"><span>나의 취향 테스트</span><span>${n+1} / 8</span></div><div class="track"><div style="width:${(n+1)/8*100}%"></div></div><h2>${esc(title)}</h2><p class="hint">${esc(hint)}</p><div class="choices ${isInterest?'interests':isCareer?'careers':'balance'}">${opts.map(o=>`<button class="choice ${selected.includes(o.value)?'selected':''}" data-v="${esc(o.value)}">${esc(o.label)}</button>`).join('')}</div><div class="foot"><button class="btn secondary" id="prev" ${n===0?'disabled':''}>이전</button><button class="btn" id="next" ${!canNext()?'disabled':''}>${n===7?'나의 동아리 결과 보기':'다음 질문 →'}</button></div>`;
document.querySelectorAll('[data-v]').forEach(el=>el.addEventListener('click',()=>{let v=el.dataset.v;if(isInterest){state.interest=state.interest.includes(v)?state.interest.filter(x=>x!==v):state.interest.length<2?[...state.interest,v]:[state.interest[1],v]}else if(isCareer){state.career=v}else{state.balance[n-1]=v}render()}));$('prev').onclick=()=>{state.step--;render()};$('next').onclick=()=>{if(n===7){state.result=calculate();render()}else{state.step++;render()}}}
function canNext(){return state.step===0?state.interest.length>0:state.step===7?state.career!==null:state.balance[state.step-1]!==null}
function scoreClub(c){let sum=0;let reasons=[];const inter=state.interest.filter(x=>c.tags.includes(x));if(inter.length){sum+=40*inter.length/state.interest.length;reasons.push('관심 분야와 일치')}
let activityPts=0;for(let i=0;i<6;i++){const q=DATA.questions[i],chosen=state.balance[i]==='a'?q.at:q.bt;const hits=chosen.filter(t=>c.tags.includes(t));if(hits.length)activityPts+=40/6*Math.min(1,hits.length/2);}sum+=activityPts;if(activityPts>0)reasons.push('선택한 활동 취향과 연결');
if(state.career&&state.career!=='none'&&c.careers.includes(state.career)){sum+=20;reasons.push('관심 진로 분야와 관련')};return {c,score:Math.round(sum*10)/10,reasons};}
function calculate(){let items=DATA.clubs.filter(c=>!sportGroup.has(c.name)).map(scoreClub);let sports=DATA.clubs.filter(c=>sportGroup.has(c.name));let chosen=sports[Math.floor(Math.random()*sports.length)];items.push(scoreClub(chosen));items.sort((a,b)=>b.score-a.score||a.c.name.localeCompare(b.c.name,'ko'));
const selected=[];const usedGroups=new Set();for(const x of items){if(selected.length>=3)break;if(selected.length<2&&usedGroups.has(x.c.group))continue;selected.push(x);usedGroups.add(x.c.group)}for(const x of items){if(selected.length>=3)break;if(!selected.includes(x))selected.push(x)}return selected}
function renderResult(){let result=state.result;$('app').innerHTML=`<div class="results-head"><div style="font-size:12px;letter-spacing:1px;font-weight:800;color:#2778b5">MY CLUB MATCH</div><h2>나와 어울리는 동아리 TOP 3</h2><p>선택한 관심 분야, 활동 취향, 희망 진로를 바탕으로 추천했어요.</p></div>${result.map((r,i)=>`<article class="result"><div class="medal">${i+1}</div><div><h3>${esc(r.c.name)}</h3><span class="chip">${esc(r.c.group)}</span><span class="chip">매칭 점수 ${Math.round(r.score)}점</span><p><b>실제 활동:</b> ${esc(r.c.activities)}</p><p>${r.reasons.length?esc(r.reasons.join(' · ')):'새로운 분야를 경험해 보는 선택지'}${sportGroup.has(r.c.name)?' · 종합체육 동아리 중 무작위로 1개 선택':''}</p></div></article>`).join('')}<div class="warn">※ 매칭 점수는 학생이 선택한 응답과 동아리 활동 키워드의 일치 정도를 나타냅니다. 적성이나 능력을 평가하는 점수가 아닙니다. 활동 내용은 학교 제공 자료에 근거하며, 동아리 운영은 학년도별로 달라질 수 있습니다.</div><div class="tools"><button class="btn" id="all">${state.showAll?'전체 목록 닫기':'전체 27개 동아리 보기'}</button><button class="btn secondary" id="again">다시 테스트하기</button></div><div id="library"></div>`;$('all').onclick=()=>{state.showAll=!state.showAll;renderResult()};$('again').onclick=()=>{state.step=0;state.interest=[];state.balance=Array(6).fill(null);state.career=null;state.result=null;state.showAll=false;render()};if(state.showAll){$('library').innerHTML=`<div class="library"><h2>창원경일고 동아리 전체 보기</h2><div class="allclub">${DATA.clubs.map(c=>`<div class="club"><strong>${esc(c.name)}</strong><small>${esc(c.activities)}</small></div>`).join('')}</div></div>`}}
render();
</script></body></html>
