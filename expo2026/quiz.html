<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경달이와 함께하는 고교학점제 대탐험!</title>
<style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;color:#173452;background:#eaf4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 6% 12%,#fff0c5,transparent 31%),radial-gradient(circle at 92% 88%,#cff4ec,transparent 35%),#eaf3ff;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffb62c;outline-offset:3px}.wrap{max-width:900px;margin:auto;padding:24px 16px 65px}.shell{background:#fff;border-radius:26px;box-shadow:0 18px 55px #1c4a7527;overflow:hidden}.header{background:linear-gradient(115deg,#164e9c,#2182bb);color:white;padding:24px 30px}.header .eyebrow{font-size:12px;font-weight:900;letter-spacing:1.2px;opacity:.84}.header h1{font-size:clamp(24px,4vw,34px);margin:11px 0}.header p{margin:0;opacity:.9}.main{padding:35px;min-height:430px}.footer{padding:15px;text-align:center;background:#f7fafe;color:#778ca1;font-size:12px}.hero{text-align:center;padding:22px 3px}.emoji{font-size:70px}.hero h2{font-size:clamp(24px,4vw,32px);margin:10px 0}.hero p,.muted{color:#637b93;line-height:1.8}.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:25px 0}.chip{background:#edf5ff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:800;color:#275a8f}.btn{border:0;background:#1769be;color:white;border-radius:14px;padding:14px 23px;font-weight:900;font-size:16px}.btn:hover{filter:brightness(.95)}.btn.alt{background:#eaf1f8;color:#25577e}.btn:disabled{opacity:.5;cursor:default}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{background:#e6f3ff;color:#155eaa;font-weight:900;padding:8px 12px;font-size:13px;border-radius:20px}.progress{height:10px;border-radius:14px;background:#e8eef6;margin:20px 0 27px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ffb840,#ffdc72);transition:width .2s}.question{font-size:clamp(21px,3vw,26px);line-height:1.58;margin:0 0 27px;word-break:keep-all}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}.choice{border:2px solid #dbe5f0;background:#fff;border-radius:16px;min-height:91px;padding:16px;display:flex;gap:13px;align-items:center;text-align:left;color:#183652;font-size:16px;line-height:1.5;word-break:keep-all}.choice:hover:not(:disabled){border-color:#2e8bd2;background:#f3f9ff}.choice.correct{border-color:#24a76c;background:#e8f9ef;color:#12643d;font-weight:800}.choice.wrong{border-color:#e87f7f;background:#fff0f0}.choice:disabled{cursor:default}.symbol{flex:0 0 35px;height:35px;display:grid;place-items:center;background:#edf3fa;border-radius:11px;color:#2167a7;font-weight:900}.ox{font-size:38px;font-weight:900;justify-content:center;min-height:165px}.ox .symbol{display:none}.ox.true{color:#199d60}.ox.false{color:#df5555}.shortform{display:flex;gap:10px;flex-wrap:wrap}.shortform input{border:2px solid #cadae9;border-radius:13px;padding:15px;font-size:17px;flex:1;min-width:180px}.feedback{background:#f4f8fd;border-radius:16px;padding:19px;margin:23px 0 5px;line-height:1.8}.feedback.good{border-left:5px solid #28a96c}.feedback.bad{border-left:5px solid #e78a63}.feedback strong{font-size:18px}.tools{margin-top:27px;display:flex;justify-content:space-between;gap:10px;align-items:center}.scorebig{font-size:58px;font-weight:900;color:#186cb2;margin:12px}.review{border:1px solid #dce7f1;border-radius:15px;padding:17px;margin:13px 0;text-align:left}.review .state{font-weight:900;color:#218658}.review .state.bad{color:#ce6155}.review p{margin:7px 0}.note{font-size:13px;color:#62788d;line-height:1.7;background:#f3f7fb;padding:14px;border-radius:12px;margin:18px auto;max-width:650px}.tiny{font-size:13px;color:#6d8297}.listbuttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:620px){.main{padding:22px 18px}.header{padding:20px}.answers{grid-template-columns:1fr}.choice{min-height:66px}.ox{min-height:110px}.tools{flex-wrap:wrap}.wrap{padding:10px 8px 25px}}
</style></head><body><div class="wrap"><div class="shell"><header class="header"><div class="eyebrow">CHANGWON GYEONGIL HIGH SCHOOL · 2026 EXPO</div><h1>🎓 경달이와 함께하는 고교학점제 대탐험!</h1><p>10개 퀴즈를 풀며 고등학교 생활을 미리 만나 보세요.</p></header><main id="app" class="main"></main><footer class="footer">창원경일고등학교 · 고교학점제 박람회 · 인터넷 없이 실행 가능</footer></div></div>
<script>
'use strict';
const QUIZ=[{"type": "choice", "question": "고교학점제에서 학생들이 자신의 진로와 적성에 따라 선택할 수 있는 것은 무엇일까요?", "options": ["학교 건물", "수업 과목", "담임 선생님", "학교 급식 메뉴"], "answer": 1, "id": 1}, {"type": "ox", "question": "고교학점제에서는 모든 과목을 학생이 원하는 대로 자유롭게 선택할 수 있다.", "answer": false, "id": 2}, {"type": "choice", "question": "고등학교에서 선택과목을 결정할 때 가장 바람직한 방법은 무엇일까요?", "options": ["많은 학생들이 선택하는 과목을 고른다.", "무조건 쉬워 보이는 과목을 고른다.", "자신의 진로와 흥미, 학습 목표를 고려하여 고른다.", "과목 이름이 멋진 과목을 고른다."], "answer": 2, "id": 3}, {"type": "ox", "question": "고교학점제에서는 과목별 이수 기준을 충족해야 해당 과목의 학점을 취득할 수 있다.", "answer": true, "id": 4}, {"type": "choice", "question": "고교학점제에서 공통과목의 학점을 취득하기 위해 충족해야 하는 기준은 무엇일까요?", "options": ["출석률 2/3 이상, 학업성취율 40% 이상", "출석률 2/3 이상, 학업성취율 60% 이상", "출석률 50% 이상, 학업성취율 40% 이상", "출석률 50% 이상, 학업성취율 60% 이상"], "answer": 0, "id": 5}, {"type": "ox", "question": "선택과목은 과목 출석률이 2/3 이상이면 학업성취율 40%에 미치지 못하더라도 학점을 취득할 수 있다.", "answer": true, "id": 6}, {"type": "choice", "question": "고교학점제에서 운영하는 '최소 성취수준 보장지도'에 대한 설명으로 가장 알맞은 것은 무엇일까요?", "options": ["학생이 원하는 과목을 자유롭게 선택하도록 돕는 제도", "성적이 낮은 학생에게 벌점을 부과하는 제도", "학습에 어려움을 겪는 학생에게 예방지도와 보충지도를 제공하는 제도", "성적이 우수한 학생에게 심화 수업을 제공하는 제도"], "answer": 2, "id": 7}, {"type": "choice", "question": "2027학년도 고등학교 입학생이 3년 동안 졸업을 위해 취득해야 하는 최소 학점은 몇 학점일까요?", "options": ["204학점", "192학점", "176학점", "160학점"], "answer": 1, "id": 8}, {"type": "short", "question": "교과성적, 학교 내 활동, 출결 등 고등학교 3년의 결과물을 서류로 정리하는 것을 무엇이라고 하는가? (Hint. 창원경일고는 OOO 관리가 뛰어나 학종에 유리하다.)", "accepted": ["학교생활기록부", "학교 생활기록부", "학교생활 기록부", "학교 생활 기록부", "생기부", "학생부"], "id": 9}, {"type": "choice", "question": "창원경일고 고교학점제 박람회에서 체험하거나 상담받는 활동이 아닌 것은 무엇일까요?", "options": ["자신의 흥미와 적성을 알아보는 자기 탐색 활동", "다양한 교과목을 경험하는 교과별 탐색 활동", "자신의 진로와 학업에 대한 상담 활동", "대학교 응시원서를 접수하는 활동"], "answer": 3, "id": 10}];
let page='home',pos=0,results=[],locked=false;
const app=document.getElementById('app');
const escapeHTML=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalized(t){return String(t||'').normalize('NFKC').toLowerCase().replace(/[\s\u200b\u200c\u200d·._-]/g,'').trim()}
function go(p){page=p;render();window.scrollTo(0,0)}
function start(){pos=0;results=[];locked=false;go('quiz')}
function home(){app.innerHTML=`<section class="hero"><div class="emoji">🧭</div><span class="tag">경달이의 고교학점제 챌린지</span><h2>미래 학교를 향한 퀴즈 탐험!</h2><p>문제를 맞히며 고교학점제를 알아보세요.<br>10개 문제를 모두 풀면 나의 결과를 볼 수 있어요.</p><div class="chips"><span class="chip">📝 전체 10문제</span><span class="chip">⭕ OX + 객관식 + 단답형</span><span class="chip">📶 인터넷 불필요</span></div><button class="btn" onclick="start()">탐험 시작하기 →</button><div class="note">문항과 정답은 제공된 ZEP 편집 화면의 캡처를 기준으로 구성되었습니다. 퀴즈는 학습과 체험을 위한 것으로 실제 교육과정·학교 운영 지침은 별도로 확인해 주세요.</div></section>`}
function current(){return QUIZ[pos]}
function quiz(){const q=current(),done=locked,answered=results.filter(x=>x.correct).length;const typeText=q.type==='choice'?'객관식':q.type==='ox'?'OX 퀴즈':'단답형';let body='';
 if(q.type==='choice')body=`<div class="answers">${q.options.map((a,i)=>`<button class="choice ${done?(i===q.answer?'correct':results[pos].value===i?'wrong':''):''}" onclick="choose(${i})" ${done?'disabled':''}><span class="symbol">${i+1}</span><span>${escapeHTML(a)}</span></button>`).join('')}</div>`;
 if(q.type==='ox')body=`<div class="answers"><button class="choice ox true ${done?(q.answer===true?'correct':results[pos].value===true?'wrong':''):''}" onclick="choose(true)" ${done?'disabled':''}>O</button><button class="choice ox false ${done?(q.answer===false?'correct':results[pos].value===false?'wrong':''):''}" onclick="choose(false)" ${done?'disabled':''}>X</button></div>`;
 if(q.type==='short')body=`<div class="shortform"><input id="shortAnswer" aria-label="단답형 정답" placeholder="정답을 입력하세요" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();submitShort()}" ${done?'disabled':''} value="${done?escapeHTML(results[pos].value):''}"><button class="btn" type="button" onclick="submitShort()" ${done?'disabled':''}>정답 제출</button></div><p class="tiny">띄어쓰기 차이는 정답 판정에 영향을 주지 않습니다.</p>`;
 let feedback='';if(done){const r=results[pos];const correctText=q.type==='choice'?`${q.answer+1}번 · ${q.options[q.answer]}`:q.type==='ox'?(q.answer?'O':'X'):'학교생활기록부 (생기부, 학생부도 정답)';feedback=`<div class="feedback ${r.correct?'good':'bad'}"><strong>${r.correct?'🎉 정답입니다!':'💡 아쉬워요! 정답을 확인해 보세요.'}</strong><div><b>정답:</b> ${escapeHTML(correctText)}</div></div>`}
 app.innerHTML=`<div class="row"><span class="tag">문제 ${pos+1} / ${QUIZ.length} · ${typeText}</span><span class="tag">⭐ 현재 정답 ${answered}개</span></div><div class="progress"><div class="bar" style="width:${(pos+(done?1:0))*100/QUIZ.length}%"></div></div><h2 class="question">${escapeHTML(q.question)}</h2>${body}${feedback}<div class="tools"><button class="btn alt" onclick="if(confirm('퀴즈를 종료하고 처음으로 돌아갈까요?'))go('home')">처음으로</button>${done?`<button class="btn" onclick="advance()">${pos===QUIZ.length-1?'최종 결과 보기 🏆':'다음 문제 →'}</button>`:'<span class="tiny">답을 선택하거나 입력해 주세요.</span>'}</div>`;
 if(q.type==='short'&&!done)document.getElementById('shortAnswer').focus();}
function choose(value){if(locked)return;const q=current();const correct=q.answer===value;results[pos]={value,correct};locked=true;render()}
function submitShort(){if(locked)return;const input=document.getElementById('shortAnswer');if(!input)return;const value=input.value.trim();if(!value){input.focus();return}const correct=current().accepted.some(a=>normalized(a)===normalized(value));results[pos]={value,correct};locked=true;render()}
function advance(){if(!locked)return;if(pos===QUIZ.length-1){go('result');return}pos++;locked=false;go('quiz')}
function result(){let score=results.filter(r=>r.correct).length,pct=Math.round(score/QUIZ.length*100);app.innerHTML=`<section class="hero"><div class="emoji">🏆</div><h2>경달이의 대탐험 완료!</h2><p>10문제를 모두 풀었어요. 새로운 사실을 얼마나 알게 되었나요?</p><div class="scorebig">${score} / ${QUIZ.length}</div><div class="tag">정답률 ${pct}%</div><p>${score===10?'완벽해요! 고교학점제 탐험을 모두 성공했어요!':score>=7?'멋져요! 고교학점제를 아주 잘 이해하고 있네요!':'수고했어요! 틀린 문제를 확인하고 다시 도전해 보세요.'}</p><div class="listbuttons"><button class="btn" onclick="start()">다시 도전하기</button><button class="btn alt" onclick="go('home')">첫 화면으로</button></div></section><h3>문제별 결과 확인</h3>${QUIZ.map((q,i)=>`<div class="review"><div class="row"><b>${i+1}. ${escapeHTML(q.question)}</b><span class="state ${results[i].correct?'':'bad'}">${results[i].correct?'✓ 정답':'✕ 오답'}</span></div><p class="tiny">정답: ${escapeHTML(q.type==='choice'?q.options[q.answer]:q.type==='ox'?(q.answer?'O':'X'):'학교생활기록부 (생기부·학생부)')}</p></div>`).join('')}`}
function render(){if(page==='quiz')quiz();else if(page==='result')result();else home()}
render();
</script></body></html>
