{title:'어떤 탐구가 더 재미있을까요?',hint:'직접 해보고 싶은 쪽을 선택하세요.',opts:[['우주·로봇·기계의 원리 파헤치기','우주,로봇,기계,물리'],['인체·생명·건강의 비밀 탐구하기','생명,의료,건강,약']]},
{title:'어떤 프로젝트를 해보고 싶나요?',hint:'두 가지 중 하나만 선택하세요.',opts:[['새 사업이나 서비스를 기획하기','경영,경제,기획,관광'],['사회 문제를 해결할 캠페인 기획하기','사회,정책,봉사,환경']]},
{title:'즐거운 하루를 고른다면?',hint:'활동의 즐거움이 더 큰 쪽을 선택하세요.',opts:[['몸을 움직이고 스포츠를 즐기는 하루','운동,스포츠,재활'],['책·음악·공연을 깊이 즐기는 하루','독서,음악,공연,연기']]},

let step=-1,answers={},recommendations=[],filter='전체';const app=document.querySelector('#app');
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(){step=0;render()}function toggle(i){const q=Q[step],a=answers[step]||[];answers[step]=q.multi?(a.includes(i)?a.filter(n=>n!==i):(a.length<q.multi?[...a,i]:[a[1],i])):[i];render()}function next(){if(step===Q.length-1){recommend();step=Q.length}else step++;render()}function prev(){step=Math.max(-1,step-1);render()}
function score(){const max=[35,15,7,7,7,7,7,7,20,12];let ranked=MAJORS.map(m=>{let score=0,reason=[],tokens={};for(let qi=0;qi<Q.length;qi++){let picked=answers[qi]||[];for(let index of picked){let vals=Q[qi].opts[index][1].split(',').filter(Boolean);let overlap=vals.filter(t=>m.tags.includes(t));const fallback=vals.some(v=>m.tags.some(t=>t.includes(v)||v.includes(t)));if(overlap.length||fallback){let pts=max[qi]*(qi<2?1/picked.length:1);score+=pts;reason.push(Q[qi].opts[index][0]);}}}return {...m,score,reason:[...new Set(reason)]}}).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ko'));
 // 첫 3개는 같은 분야 중복 최대 2개, 이후에는 전체에서 중복 없이 채움
 let chosen=[],counts={};for(let m of ranked){if(chosen.length===5)break;if(chosen.length<3&&(counts[m.group]||0)>=2)continue;chosen.push(m);counts[m.group]=(counts[m.group]||0)+1;}if(chosen.length<5)for(let m of ranked){if(chosen.length===5)break;if(!chosen.includes(m))chosen.push(m)}return chosen;}
function recommend(){recommendations=score()}
function catalog(){step=Q.length+1;render()}
function render(){if(step===-1){app.innerHTML=`<div class="intro"><div style="font-size:52px">🧭</div><h2>나는 어떤 학과와 잘 어울릴까?</h2><p>관심 있는 분야와 좋아하는 활동을 고르면<br>50개 대표 학과 중 나와 맞는 학과를 추천해 드려요.</p><div class="stats"><b>🎯 50개 학과</b><b>📝 10개 질문</b><b>⭐ TOP 5</b></div><button class="action" onclick="start()">테스트 시작하기 →</button> <button class="action secondary" onclick="catalog()">전체 학과 둘러보기</button></div>`;return}

if(step===Q.length){app.innerHTML=`<section class="results"><span class="tag">YOUR MAJOR MATCH</span><h2>✨ 나와 어울리는 학과 TOP 5</h2><p class="muted">응답의 관심사 일치도를 비교한 결과입니다. 적성 판정이나 입학 가능성은 아닙니다.</p>${recommendations.map((m,i)=>`<div class="card"><span class="rank">TOP ${i+1} · ${esc(m.group)}</span><h3>${esc(m.name)}</h3><div class="why">${esc(m.desc)}</div><div class="muted">추천 이유: ${esc(m.reason.length?m.reason.slice(0,2).join(' · ')+' 활동을 선택했기 때문입니다.':'선택한 여러 분야와 일부 공통점이 있는 학과입니다.')}</div><p style="font-weight:bold;font-size:13px;margin-bottom:5px">관련 고교 선택과목 탐색</p>${m.courses.map(c=>`<span class="course">${esc(c)}</span>`).join('')}</div>`).join('')}<div class="note">※ 추천 학과는 대표적인 학문 분야 예시입니다. 과목은 2022 개정 교육과정의 탐색용 예시이며, 해당 학과 진학의 필수 조건이 아닙니다. 학교의 실제 개설 과목과 대학별 권장 과목은 별도 확인해야 합니다.</div><div class="nav"><button class="action secondary" onclick="catalog()">50개 학과 모두 보기</button><button class="action" onclick="restart()">다시 테스트하기</button></div></section>`;return}

function restart(){step=-1;answers={};recommendations=[];render()}function home(){step=-1;render()}function backResult(){step=Q.length;render()}function setFilter(i){filter=['전체',...new Set(MAJORS.map(x=>x.group))][i];render()}render();
